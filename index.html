<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24364b">
  <meta name="description" content="Reading practice and worksheets from the Balmain English Learning Library.">
  <title>Reading Worksheets | Balmain English Learning Library</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24364b;
      --muted: #647181;
      --paper: #fffefa;
      --page: #e9edf0;
      --rule: #dce8f0;
      --silver: #f0f2f3;
      --silver-dark: #d8dde1;
      --accent: #a64e4b;
      --line: #d8dfe4;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font: 15px/1.55 "Segoe UI", Arial, sans-serif;
    }
    .shell { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }
    .masthead { color: #fff; background: var(--ink); box-shadow: 0 3px 12px rgba(28, 43, 58, .14); }
    .masthead-inner { min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: .02em; }
    .brand-mark { display: grid; place-items: center; width: 31px; height: 31px; border: 1px solid #b8c2cc; color: #fff; font: 1.1rem Georgia, serif; }
    .library-label { color: #d7dfe7; font-size: .82rem; }
    main { padding: 38px 0 48px; }
    .notebook {
      position: relative;
      overflow: hidden;
      min-height: 520px;
      padding: clamp(26px, 5vw, 54px) clamp(24px, 7vw, 80px) 56px clamp(42px, 9vw, 112px);
      border: 1px solid #d4dbe0;
      border-radius: 5px;
      background-color: var(--paper);
      background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--rule) 36px, transparent 37px);
      background-position: 0 13px;
      box-shadow: 0 12px 32px rgba(34, 50, 66, .10);
    }
    .notebook::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: clamp(25px, 5vw, 61px);
      width: 1px;
      background: rgba(166, 78, 75, .35);
      content: "";
    }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--ink); font: 600 clamp(2rem, 5vw, 3.15rem)/1.12 Georgia, "Times New Roman", serif; letter-spacing: -.025em; }
    .lede { max-width: 650px; margin: 10px 0 0; color: #566578; font-size: 1rem; }
    .collection { margin-top: 40px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 15px; }
    .section-title { margin: 0; font: 600 1.15rem Georgia, "Times New Roman", serif; }
    .count { margin-left: 8px; color: var(--muted); font: 500 .78rem "Segoe UI", Arial, sans-serif; }
    .search { width: min(300px, 100%); min-height: 42px; padding: 8px 12px; border: 1px solid #bfc8ce; border-radius: 4px; background: rgba(255,255,255,.9); color: var(--ink); font: inherit; }
    .search::placeholder { color: #697787; }
    .search:focus-visible { outline: 3px solid rgba(89, 123, 151, .35); outline-offset: 2px; border-color: #597b97; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 0; margin: 0; list-style: none; }
    .grid li { min-width: 0; }
    .exercise {
      display: flex;
      min-height: 90px;
      height: 100%;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 15px 12px;
      border: 1px solid #c8cfd4;
      border-radius: 5px;
      background: linear-gradient(180deg, #fff 0%, var(--silver) 100%);
      box-shadow: 0 2px 3px rgba(33, 48, 62, .07), inset 0 1px rgba(255,255,255,.9);
      color: var(--ink);
      text-decoration: none;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .exercise:hover { transform: translateY(-2px); border-color: #9daab3; background: linear-gradient(180deg, #fff 0%, #e8ecef 100%); box-shadow: 0 5px 12px rgba(33, 48, 62, .12); }
    .exercise:focus-visible { outline: 3px solid #597b97; outline-offset: 3px; }
    .exercise-title { font-size: .96rem; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
    .exercise-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px solid #d7dde1; color: #5e6b78; font-size: .75rem; }
    .open { color: #344f67; font-weight: 700; white-space: nowrap; }
    .message { grid-column: 1 / -1; padding: 22px; border: 1px dashed #b6c0c7; border-radius: 4px; background: rgba(255,255,255,.72); color: var(--muted); text-align: center; }
    footer { padding: 18px 0 24px; color: #596776; font-size: .78rem; text-align: center; }
    @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } main { padding-top: 24px; } }
    @media (max-width: 560px) {
      .shell { width: calc(100% - 28px); }
      .masthead-inner { min-height: 56px; }
      .notebook { min-height: 480px; padding: 31px 18px 40px 42px; }
      .notebook::before { left: 25px; }
      .toolbar { align-items: stretch; flex-direction: column; gap: 12px; }
      .search { width: 100%; }
      .grid { grid-template-columns: 1fr; }
      .collection { margin-top: 30px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } .exercise:hover { transform: none; } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">B</span><span>Balmain English</span></div>
      <div class="library-label">Learning Library</div>
    </div>
  </header>
  <main class="shell">
    <div class="notebook">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Read, learn, grow</p>
        <h1 id="page-title">Reading Worksheets</h1>
        <p class="lede">Choose an exercise and build your confidence, one page at a time. New worksheets appear here automatically as they are added to the collection.</p>
      </section>
      <section class="collection" aria-label="Reading worksheet directory">
        <div class="toolbar">
          <h2 class="section-title">Explore the exercises <span class="count" id="count" aria-live="polite">Loading…</span></h2>
          <input id="search" class="search" type="search" placeholder="Search worksheets" aria-label="Search reading worksheets">
        </div>
        <ul id="items" class="grid" aria-live="polite" aria-busy="true"></ul>
      </section>
    </div>
  </main>
  <footer><div class="shell">Balmain English · Learning Library</div></footer>
  <script>
    (() => {
      const owner = 'Balmain-English';
      const repo = 'reading-worksheets';
      const branch = 'main';
      const list = document.getElementById('items');
      const search = document.getElementById('search');
      const count = document.getElementById('count');
      let pages = [];

      const titleOf = path => path.split('/').pop()
        .replace(/\.html?$/i, '')
        .replace(/[-_]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b\w/g, character => character.toUpperCase());

      function render() {
        const query = search.value.trim().toLowerCase();
        const visible = pages.filter(page => page.title.toLowerCase().includes(query) || page.path.toLowerCase().includes(query));
        count.textContent = `${visible.length} ${visible.length === 1 ? 'worksheet' : 'worksheets'}`;
        list.replaceChildren();

        if (!visible.length) {
          const item = document.createElement('li');
          item.className = 'message';
          item.textContent = pages.length ? 'No worksheets match your search.' : 'No worksheets are available yet. Check back soon.';
          list.append(item);
          return;
        }

        const fragment = document.createDocumentFragment();
        visible.forEach(page => {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.className = 'exercise';
          link.href = './' + page.path.split('/').map(encodeURIComponent).join('/');

          const title = document.createElement('span');
          title.className = 'exercise-title';
          title.textContent = page.title;
          const meta = document.createElement('span');
          meta.className = 'exercise-meta';
          const type = document.createElement('span');
          type.textContent = 'Reading exercise';
          const open = document.createElement('span');
          open.className = 'open';
          open.textContent = 'Start reading ↗';
          meta.append(type, open);
          link.append(title, meta);
          item.append(link);
          fragment.append(item);
        });
        list.append(fragment);
      }

      fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error('Unable to load worksheets');
          return response.json();
        })
        .then(data => {
          pages = (data.tree || [])
            .filter(file => file.type === 'blob' && /\.html?$/i.test(file.path) && !/^index\.html?$/i.test(file.path.split('/').pop()))
            .map(file => ({ path: file.path, title: titleOf(file.path) }))
            .sort((a, b) => a.title.localeCompare(b.title));
          list.setAttribute('aria-busy', 'false');
          render();
        })
        .catch(() => {
          count.textContent = 'Worksheets unavailable';
          list.setAttribute('aria-busy', 'false');
          const message = document.createElement('li');
          message.className = 'message';
          message.textContent = 'Unable to load worksheets right now. Please try again later.';
          list.replaceChildren(message);
        });

      search.addEventListener('input', render);
    })();
  </script>
</body>
</html>
